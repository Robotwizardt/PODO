<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PODO 周计划桌面效果原型</title>
  <!-- Desktop placement prototype for a morning/afternoon weekly plan. PROTOTYPE ONLY. -->
  <style>
    :root {
      --text: #f4f8ff;
      --muted: #b5c4d9;
      --faint: #8297b1;
      --accent: #54b8ff;
      --accent-soft: rgba(84, 184, 255, .18);
      --green: #42d392;
      --border: rgba(255, 255, 255, .17);
      --inner: rgba(255, 255, 255, .07);
      --panel: rgba(8, 19, 34, .82);
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      margin: 0;
      min-width: 980px;
      min-height: 620px;
      overflow: hidden;
      color: var(--text);
      background-color: #266da5;
      background-image: url("../docs/images/witchdrawer-desktop-showcase.png");
      background-position: center;
      background-size: cover;
      font-size: 12px;
    }

    button, a { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }

    button:focus-visible, a:focus-visible {
      outline: 2px solid #d7efff;
      outline-offset: 2px;
    }

    .desktop-shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(2, 11, 22, .08);
    }

    .widget {
      position: absolute;
      left: 2.2vw;
      top: 4.5vh;
      width: min(560px, 48vw);
      min-width: 500px;
      max-width: calc(100vw - 36px);
      min-height: 180px;
      max-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      overflow: auto;
      resize: both;
      border: 1px solid rgba(220, 238, 255, .34);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(0, 17, 40, .28), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(18px) saturate(120%);
    }

    .widget.locked { resize: none; }

    .widget-header {
      min-height: 44px;
      display: grid;
      grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr);
      align-items: center;
      gap: 10px;
      padding: 6px 8px 6px 11px;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 22, 39, .72);
      cursor: move;
      user-select: none;
    }

    .widget.locked .widget-header { cursor: default; }

    .title-block { min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 6px; }
    .title-row svg { width: 14px; height: 14px; color: var(--accent); }
    .title-row strong { font-size: 12px; font-weight: 650; }
    .title-block small { display: block; margin: 1px 0 0 20px; color: var(--muted); font-size: 9px; }

    .week-nav { display: flex; align-items: center; gap: 5px; }
    .week-label { min-width: 112px; text-align: center; font-weight: 600; font-size: 10px; font-variant-numeric: tabular-nums; }
    .header-actions { display: flex; justify-content: flex-end; gap: 4px; }

    .icon-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease;
    }

    .icon-button:hover { color: var(--text); border-color: var(--border); background: var(--inner); }
    .icon-button.active { color: var(--accent); border-color: rgba(84, 184, 255, .38); background: var(--accent-soft); }
    .icon-button svg { width: 14px; height: 14px; }

    .widget-content {
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 7px 7px;
    }

    .widget.collapsed { width: 390px; min-width: 340px; height: auto !important; min-height: 0; resize: none; overflow: hidden; }
    .widget.collapsed .widget-content { display: none; }
    .widget.collapsed .widget-header { border-bottom: 0; }

    .days-head,
    .period-row {
      display: grid;
      grid-template-columns: 36px repeat(7, minmax(68px, 1fr));
    }

    .days-head {
      min-height: 38px;
      border-bottom: 1px solid var(--border);
    }

    .day-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      border-left: 1px solid var(--border);
      font-size: 8px;
    }

    .day-head strong { color: var(--text); font-size: 10px; font-variant-numeric: tabular-nums; }
    .day-head.today { color: var(--accent); background: rgba(84, 184, 255, .07); }
    .day-head.today strong { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: #07101d; background: var(--accent); }

    .period-row + .period-row { border-top: 1px solid var(--border); }

    .period-label {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 8px;
    }

    .period-label svg { width: 13px; height: 13px; color: var(--accent); }

    .day-slot {
      min-width: 0;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 5px;
      border-left: 1px solid var(--border);
      background: rgba(255, 255, 255, .015);
    }

    .day-slot.today { background: rgba(84, 184, 255, .055); }

    .task {
      width: 100%;
      min-height: 28px;
      display: grid;
      grid-template-columns: 11px minmax(0, 1fr);
      gap: 4px;
      align-items: start;
      padding: 4px 5px;
      border: 1px solid var(--task-border);
      border-left: 3px solid var(--task-color);
      border-radius: 6px;
      color: var(--text);
      background: var(--task-bg);
      text-align: left;
      transition: filter 130ms ease, opacity 130ms ease;
    }

    .task:hover { filter: brightness(1.13); }
    .task.done { opacity: .5; }
    .task.done .task-title { text-decoration: line-through; }
    .check { width: 10px; height: 10px; margin-top: 1px; border: 1px solid var(--task-color); border-radius: 50%; }
    .task.done .check { background: var(--task-color); box-shadow: inset 0 0 0 3px var(--task-bg); }
    .task-title { display: block; overflow: hidden; font-size: 8px; font-weight: 650; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .task-project { display: block; margin-top: 1px; overflow: hidden; color: var(--muted); font-size: 7px; text-overflow: ellipsis; white-space: nowrap; }
    .empty { margin: auto; color: rgba(181, 196, 217, .62); font-size: 8px; }
    .overflow { margin-top: auto; color: var(--accent); font-size: 7px; text-align: center; }

    .widget-footer {
      min-height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 6px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 8px;
    }

    .progress { display: flex; align-items: center; gap: 7px; }
    .progress-track { width: 70px; height: 3px; overflow: hidden; border-radius: 3px; background: rgba(255, 255, 255, .1); }
    .progress-bar { width: 24%; height: 100%; background: var(--green); transition: width 160ms ease; }

    .demo-bar {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 8px;
      background: rgba(5, 14, 26, .9);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .32);
      backdrop-filter: blur(14px);
    }

    .demo-link {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border-radius: 6px;
      color: var(--text);
      text-decoration: none;
      background: var(--accent-soft);
    }

    .demo-link svg { width: 14px; height: 14px; }
    .demo-label { padding: 0 6px; color: var(--muted); font-size: 9px; }

    .toast {
      position: fixed;
      right: 14px;
      bottom: 14px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: rgba(9, 22, 39, .94);
      opacity: 0;
      transform: translateY(7px);
      pointer-events: none;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    [hidden] { display: none !important; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 7, 16, .68);
      z-index: 20;
    }

    .dialog-backdrop.open { display: flex; }

    .dialog {
      width: min(600px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      border: 1px solid rgba(220, 238, 255, .32);
      border-radius: 8px;
      background: #101e31;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48);
    }

    .dialog-header { min-height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 8px 17px; border-bottom: 1px solid var(--border); }
    .dialog-header h2 { margin: 0; font-size: 15px; }
    .dialog-content { padding: 16px 18px; }
    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 14px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: #0b1728; }
    .mode-switch button { min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 6px; color: var(--muted); background: transparent; }
    .mode-switch button.active { color: var(--text); border-color: rgba(84, 184, 255, .35); background: var(--accent-soft); }
    .mode-switch svg { width: 15px; height: 15px; color: var(--accent); }
    .mode-copy { margin: 0 0 9px; color: var(--muted); font-size: 10px; }
    .source-list { max-height: 208px; display: grid; gap: 5px; overflow-y: auto; }
    .source-item { width: 100%; min-height: 48px; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; color: var(--text); background: rgba(255, 255, 255, .055); text-align: left; }
    .source-item.selected { border-color: var(--accent); background: var(--accent-soft); }
    .source-radio { width: 14px; height: 14px; border: 1px solid var(--border); border-radius: 50%; }
    .source-item.selected .source-radio { border: 4px solid var(--accent); }
    .source-title { display: block; font-size: 11px; font-weight: 600; }
    .source-label { display: block; margin-top: 2px; color: var(--faint); font-size: 9px; }
    .source-project { padding: 2px 5px; border-radius: 4px; color: var(--source-color); background: var(--source-soft); font-size: 8px; }
    .source-empty { padding: 20px; color: var(--muted); text-align: center; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 10px; }
    .field input, .field select { width: 100%; min-height: 38px; padding: 0 9px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); background: #17283d; }
    .inherit-hint { min-height: 32px; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); background: #17283d; font-size: 9px; }
    .inherit-hint svg { width: 12px; height: 12px; color: var(--accent); }
    .schedule-block { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--border); }
    .schedule-block h3 { margin: 0 0 9px; font-size: 11px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 7px; padding: 0 18px 17px; }
    .text-button { min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); background: rgba(255, 255, 255, .05); }
    .text-button.primary { color: #07101d; border-color: var(--accent); background: var(--accent); font-weight: 650; }
    .text-button svg { width: 14px; height: 14px; }

    @media (max-width: 1200px) {
      .widget { left: 16px; top: 22px; width: min(560px, calc(100vw - 32px)); min-width: 500px; max-width: none; }
      .widget-header { grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr); }
      .days-head, .period-row { grid-template-columns: 36px repeat(7, minmax(68px, 1fr)); }
      .task-title { font-size: 7.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="desktop-shade"></div>

  <section class="widget" id="widget" aria-label="桌面周计划">
    <header class="widget-header" id="dragHandle">
      <div class="title-block">
        <div class="title-row"><i data-lucide="calendar-days" aria-hidden="true"></i><strong>周计划</strong></div>
        <small id="summaryText">17 项 · 3 项已完成</small>
      </div>

      <div class="week-nav">
        <button class="icon-button" id="prevWeek" type="button" aria-label="上一周" title="上一周"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <span class="week-label" id="weekLabel"></span>
        <button class="icon-button" id="nextWeek" type="button" aria-label="下一周" title="下一周"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="addButton" type="button" aria-label="添加待办" title="添加待办"><i data-lucide="plus" aria-hidden="true"></i></button>
        <button class="icon-button" id="lockButton" type="button" aria-label="锁定位置" aria-pressed="false" title="锁定位置"><i data-lucide="lock-open" aria-hidden="true"></i></button>
        <button class="icon-button" id="collapseButton" type="button" aria-label="折叠周计划" aria-expanded="true" title="折叠"><i data-lucide="chevron-up" aria-hidden="true"></i></button>
      </div>
    </header>

    <div class="widget-content">
      <div class="days-head" id="daysHead"></div>
      <div id="periodRows"></div>
      <footer class="widget-footer">
        <span>上午、下午各最多安排 3 项</span>
        <div class="progress"><span id="progressText">18%</span><span class="progress-track"><span class="progress-bar" id="progressBar"></span></span></div>
      </footer>
    </div>
  </section>

  <div class="dialog-backdrop" id="addDialog" role="dialog" aria-modal="true" aria-labelledby="addDialogTitle">
    <form class="dialog" id="addForm">
      <div class="dialog-header"><h2 id="addDialogTitle">添加到周计划</h2><button class="icon-button" id="closeDialog" type="button" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="dialog-content">
        <div class="mode-switch" role="group" aria-label="添加方式">
          <button type="button" class="active" data-add-mode="existing" aria-pressed="true"><i data-lucide="list-checks" aria-hidden="true"></i>选择现有待办</button>
          <button type="button" data-add-mode="new" aria-pressed="false"><i data-lucide="square-pen" aria-hidden="true"></i>新建待办事项</button>
        </div>
        <section id="existingPanel"><p class="mode-copy">仅显示所有待办标签中未归档、未完成且未排入周计划的事项。</p><div class="source-list" id="sourceList" role="radiogroup" aria-label="可选择的现有待办"></div></section>
        <section id="newPanel" hidden><p class="mode-copy">选择待办标签并输入内容，将同步新建到对应标签。</p><div class="form-grid"><div class="field"><label for="labelSelect">待办标签</label><select id="labelSelect" name="label"></select></div><div class="field"><label for="newTitle">待办事项</label><input id="newTitle" name="title" maxlength="80" placeholder="写下一件要做的事" disabled></div><div class="field full"><div class="inherit-hint" id="inheritHint"></div></div></div></section>
        <div class="schedule-block"><h3>安排到本周</h3><div class="form-grid"><div class="field"><label for="daySelect">安排日期</label><select id="daySelect" name="day"></select></div><div class="field"><label for="periodSelect">安排时段</label><select id="periodSelect" name="period"><option value="morning">上午</option><option value="afternoon">下午</option></select></div></div></div>
      </div>
      <div class="dialog-actions"><button class="text-button" id="cancelDialog" type="button">取消</button><button class="text-button primary" type="submit"><i data-lucide="plus" aria-hidden="true"></i><span id="submitLabel">加入周计划</span></button></div>
    </form>
  </div>

  <div class="demo-bar">
    <a class="demo-link" href="weekly-plan-prototype.html?variant=A"><i data-lucide="panel-left" aria-hidden="true"></i>返回主界面</a>
    <span class="demo-label">桌面效果原型</span>
    <button class="icon-button" id="resetButton" type="button" aria-label="重置窗体位置" title="重置位置"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    const MS_DAY = 86400000;
    const days = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    const periods = {
      morning: { label: "上午", icon: "sunrise" },
      afternoon: { label: "下午", icon: "sunset" }
    };
    const projects = {
      podo: { name: "PODO 2.0", color: "#54b8ff", soft: "rgba(84,184,255,.18)" },
      thesis: { name: "毕业设计", color: "#a99bff", soft: "rgba(169,155,255,.18)" },
      website: { name: "官网改版", color: "#ffb15c", soft: "rgba(255,177,92,.17)" }
    };
    const todoLabels = [
      { id: "study", name: "学习清单", project: "thesis", archived: false },
      { id: "podo", name: "PODO 待办", project: "podo", archived: false },
      { id: "client", name: "客户事项", project: "website", archived: false },
      { id: "life", name: "生活待办", project: null, archived: false },
      { id: "old", name: "旧项目清单", project: "website", archived: true }
    ];
    const sourceTodos = [
      { id: 101, label: "study", title: "整理参考文献格式", completed: false, archived: false, scheduled: false },
      { id: 102, label: "podo", title: "检查桌面周计划窗口层级", completed: false, archived: false, scheduled: false },
      { id: 103, label: "client", title: "确认移动端首页图片", completed: false, archived: false, scheduled: false },
      { id: 104, label: "life", title: "预约周末体检", completed: false, archived: false, scheduled: false },
      { id: 105, label: "life", title: "领取快递", completed: true, archived: false, scheduled: false },
      { id: 106, label: "old", title: "旧项目回访", completed: false, archived: false, scheduled: false }
    ];
    const tasks = [
      { id: 1, day: 0, period: "morning", title: "提交数据结构课程作业", project: "thesis", done: true },
      { id: 2, day: 0, period: "afternoon", title: "整理开题答辩材料", project: "thesis", done: false },
      { id: 3, day: 1, period: "morning", title: "确认首页文案", project: "website", done: false },
      { id: 4, day: 1, period: "afternoon", title: "预约打印店装订", project: null, done: true },
      { id: 5, day: 2, period: "morning", title: "晨跑 5 公里", project: null, done: true },
      { id: 6, day: 2, period: "afternoon", title: "修复收纳盒拖拽", project: "podo", done: false },
      { id: 7, day: 3, period: "morning", title: "周计划原型评审", project: "podo", done: false },
      { id: 8, day: 3, period: "morning", title: "确认空状态文案", project: "podo", done: false },
      { id: 9, day: 3, period: "morning", title: "整理交互反馈", project: "podo", done: false },
      { id: 12, day: 3, period: "afternoon", title: "整理功能验收清单", project: "podo", done: false },
      { id: 13, day: 3, period: "afternoon", title: "阅读设计心理学", project: null, done: false },
      { id: 14, day: 4, period: "morning", title: "官网改版项目周会", project: "website", done: false },
      { id: 15, day: 4, period: "afternoon", title: "汇总本周学习笔记", project: null, done: false },
      { id: 16, day: 5, period: "morning", title: "购买下周生活用品", project: null, done: false },
      { id: 17, day: 6, period: "afternoon", title: "制定下周计划", project: null, done: false }
    ];

    const widget = document.getElementById("widget");
    const baseMonday = mondayOf(new Date());
    let displayedMonday = new Date(baseMonday);
    let locked = false;
    let collapsed = false;
    let addMode = "existing";
    let selectedSourceTodoId = null;
    let nextTaskId = 30;
    let nextSourceTodoId = 200;
    let toastTimer;

    function mondayOf(date) {
      const result = new Date(date);
      result.setHours(0, 0, 0, 0);
      const day = result.getDay() || 7;
      result.setDate(result.getDate() - day + 1);
      return result;
    }

    function isoDate(date) {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function dateAt(index) { return new Date(displayedMonday.getTime() + index * MS_DAY); }
    function isToday(date) { return isoDate(date) === isoDate(new Date()); }
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]); }
    function renderIcons() { if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.8 } }); }

    function labelById(id) { return todoLabels.find(label => label.id === id); }
    function availableTodos() { return sourceTodos.filter(todo => { const label = labelById(todo.label); return label && !label.archived && !todo.archived && !todo.completed && !todo.scheduled; }); }

    function renderSourceList() {
      const available = availableTodos();
      if (!available.some(todo => todo.id === selectedSourceTodoId)) selectedSourceTodoId = available[0]?.id ?? null;
      document.getElementById("sourceList").innerHTML = available.length ? available.map(todo => {
        const label = labelById(todo.label);
        const project = label.project ? projects[label.project] : null;
        const selected = todo.id === selectedSourceTodoId;
        return `<button class="source-item ${selected ? "selected" : ""}" type="button" role="radio" aria-checked="${selected}" data-source-id="${todo.id}"><span class="source-radio" aria-hidden="true"></span><span><span class="source-title">${escapeHtml(todo.title)}</span><span class="source-label">待办标签：${escapeHtml(label.name)}</span></span>${project ? `<span class="source-project" style="--source-color:${project.color};--source-soft:${project.soft}">${escapeHtml(project.name)}</span>` : ""}</button>`;
      }).join("") : '<div class="source-empty">没有可加入的未完成待办</div>';
    }

    function updateHint() {
      const label = labelById(document.getElementById("labelSelect").value);
      const project = label?.project ? projects[label.project] : null;
      document.getElementById("inheritHint").innerHTML = project ? `<i data-lucide="briefcase-business" aria-hidden="true"></i>自动关联项目收纳盒：<strong style="color:${project.color}">${escapeHtml(project.name)}</strong>` : '<i data-lucide="tag" aria-hidden="true"></i>该标签未关联项目收纳盒';
      renderIcons();
    }

    function setAddMode(mode) {
      addMode = mode;
      const existing = mode === "existing";
      document.getElementById("existingPanel").hidden = !existing;
      document.getElementById("newPanel").hidden = existing;
      document.getElementById("newTitle").disabled = existing;
      document.getElementById("newTitle").required = !existing;
      document.getElementById("submitLabel").textContent = existing ? "加入周计划" : "新建并加入";
      document.querySelectorAll("[data-add-mode]").forEach(button => { const active = button.dataset.addMode === mode; button.classList.toggle("active", active); button.setAttribute("aria-pressed", String(active)); });
      if (existing) renderSourceList(); else updateHint();
    }

    function openAddDialog() {
      document.getElementById("daySelect").innerHTML = days.map((day, index) => `<option value="${index}">${day} · ${dateAt(index).getMonth() + 1}月${dateAt(index).getDate()}日</option>`).join("");
      document.getElementById("labelSelect").innerHTML = todoLabels.filter(label => !label.archived).map(label => `<option value="${label.id}">${escapeHtml(label.name)}</option>`).join("");
      document.getElementById("newTitle").value = "";
      selectedSourceTodoId = null;
      setAddMode("existing");
      updateHint();
      document.getElementById("addDialog").classList.add("open");
      setTimeout(() => document.querySelector("[data-source-id]")?.focus(), 0);
      renderIcons();
    }

    function closeAddDialog() { document.getElementById("addDialog").classList.remove("open"); }

    function renderTask(task) {
      const project = task.project ? projects[task.project] : { name: "", color: "#8297b1", soft: "rgba(130,151,177,.15)" };
      return `<button type="button" class="task ${task.done ? "done" : ""}" data-task-id="${task.id}" style="--task-color:${project.color};--task-bg:${project.soft};--task-border:${project.color}66" aria-label="${task.done ? "恢复" : "完成"}待办：${escapeHtml(task.title)}"><span class="check" aria-hidden="true"></span><span><span class="task-title">${escapeHtml(task.title)}</span>${task.project ? `<span class="task-project">${escapeHtml(project.name)}</span>` : ""}</span></button>`;
    }

    function render() {
      const weekEnd = dateAt(6);
      document.getElementById("weekLabel").textContent = `${displayedMonday.getMonth() + 1}.${displayedMonday.getDate()} - ${weekEnd.getMonth() + 1}.${weekEnd.getDate()}`;
      document.getElementById("daysHead").innerHTML = `<div></div>${days.map((day, index) => {
        const date = dateAt(index);
        return `<div class="day-head ${isToday(date) ? "today" : ""}"><span>${day}</span><strong>${date.getDate()}</strong></div>`;
      }).join("")}`;

      document.getElementById("periodRows").innerHTML = Object.entries(periods).map(([period, info]) => {
        const slots = days.map((_, day) => {
          const list = tasks.filter(task => task.day === day && task.period === period);
          const shown = list.slice(0, 3);
          const extra = Math.max(0, list.length - shown.length);
          return `<div class="day-slot ${isToday(dateAt(day)) ? "today" : ""}">${shown.length ? shown.map(renderTask).join("") : '<span class="empty">无安排</span>'}${extra ? `<span class="overflow">另有 ${extra} 项</span>` : ""}</div>`;
        }).join("");
        return `<div class="period-row"><div class="period-label"><i data-lucide="${info.icon}" aria-hidden="true"></i><span>${info.label}</span></div>${slots}</div>`;
      }).join("");

      const completed = tasks.filter(task => task.done).length;
      const progress = Math.round(completed / tasks.length * 100);
      document.getElementById("summaryText").textContent = `${tasks.length} 项 · ${completed} 项已完成`;
      document.getElementById("progressText").textContent = `${progress}%`;
      document.getElementById("progressBar").style.width = `${progress}%`;
      renderIcons();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.addEventListener("click", event => {
      const taskButton = event.target.closest("[data-task-id]");
      if (!taskButton) return;
      const task = tasks.find(item => item.id === Number(taskButton.dataset.taskId));
      if (!task) return;
      task.done = !task.done;
      const sourceTodo = sourceTodos.find(item => item.id === task.sourceTodoId);
      if (sourceTodo) sourceTodo.completed = task.done;
      showToast(task.done ? "已标记为完成" : "已恢复为待完成");
      render();
    });

    document.getElementById("addDialog").addEventListener("click", event => {
      const modeButton = event.target.closest("[data-add-mode]");
      if (modeButton) { setAddMode(modeButton.dataset.addMode); return; }
      const sourceButton = event.target.closest("[data-source-id]");
      if (sourceButton) { selectedSourceTodoId = Number(sourceButton.dataset.sourceId); renderSourceList(); }
    });

    document.getElementById("addDialog").addEventListener("mousedown", event => {
      if (event.target === event.currentTarget) closeAddDialog();
    });

    document.getElementById("addButton").addEventListener("click", openAddDialog);
    document.getElementById("closeDialog").addEventListener("click", closeAddDialog);
    document.getElementById("cancelDialog").addEventListener("click", closeAddDialog);
    document.getElementById("labelSelect").addEventListener("change", updateHint);

    document.getElementById("addForm").addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const day = Number(data.get("day"));
      const period = String(data.get("period"));
      if (tasks.filter(task => task.day === day && task.period === period).length >= 3) {
        showToast(`${days[day]}${periods[period].label}已安排 3 项，请选择其他时段`);
        return;
      }

      let title;
      let project;
      let sourceTodoId;
      if (addMode === "existing") {
        const sourceTodo = sourceTodos.find(todo => todo.id === selectedSourceTodoId);
        if (!sourceTodo || !availableTodos().some(todo => todo.id === sourceTodo.id)) { showToast("请先选择一条未完成待办"); return; }
        const label = labelById(sourceTodo.label);
        title = sourceTodo.title;
        project = label.project;
        sourceTodoId = sourceTodo.id;
        sourceTodo.scheduled = true;
      } else {
        const label = labelById(String(data.get("label")));
        title = String(data.get("title")).trim();
        if (!label || !title) { showToast("请选择待办标签并输入待办事项"); return; }
        project = label.project;
        sourceTodoId = nextSourceTodoId++;
        sourceTodos.push({ id: sourceTodoId, label: label.id, title, completed: false, archived: false, scheduled: true });
      }

      tasks.push({ id: nextTaskId++, day, period, title, project, sourceTodoId, done: false });
      closeAddDialog();
      showToast(addMode === "existing" ? "已从现有待办加入周计划" : "已在对应标签中新建并加入周计划");
      render();
    });

    document.getElementById("prevWeek").addEventListener("click", () => { displayedMonday = new Date(displayedMonday.getTime() - 7 * MS_DAY); render(); });
    document.getElementById("nextWeek").addEventListener("click", () => { displayedMonday = new Date(displayedMonday.getTime() + 7 * MS_DAY); render(); });

    document.getElementById("lockButton").addEventListener("click", event => {
      locked = !locked;
      widget.classList.toggle("locked", locked);
      event.currentTarget.classList.toggle("active", locked);
      event.currentTarget.setAttribute("aria-pressed", String(locked));
      event.currentTarget.setAttribute("aria-label", locked ? "解除位置锁定" : "锁定位置");
      event.currentTarget.title = locked ? "解除锁定" : "锁定位置";
      event.currentTarget.innerHTML = `<i data-lucide="${locked ? "lock" : "lock-open"}" aria-hidden="true"></i>`;
      showToast(locked ? "周计划位置已锁定" : "周计划可以移动和缩放");
      renderIcons();
    });

    document.getElementById("collapseButton").addEventListener("click", event => {
      collapsed = !collapsed;
      widget.classList.toggle("collapsed", collapsed);
      event.currentTarget.setAttribute("aria-expanded", String(!collapsed));
      event.currentTarget.setAttribute("aria-label", collapsed ? "展开周计划" : "折叠周计划");
      event.currentTarget.title = collapsed ? "展开" : "折叠";
      event.currentTarget.innerHTML = `<i data-lucide="${collapsed ? "chevron-down" : "chevron-up"}" aria-hidden="true"></i>`;
      renderIcons();
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      widget.style.left = "2.2vw";
      widget.style.top = "4.5vh";
      widget.style.width = "min(560px, 48vw)";
      widget.style.height = "auto";
      showToast("已恢复默认位置");
    });

    let dragState = null;
    document.getElementById("dragHandle").addEventListener("pointerdown", event => {
      if (locked || event.target.closest("button")) return;
      const rect = widget.getBoundingClientRect();
      dragState = { x: event.clientX, y: event.clientY, left: rect.left, top: rect.top };
      event.currentTarget.setPointerCapture(event.pointerId);
    });

    document.getElementById("dragHandle").addEventListener("pointermove", event => {
      if (!dragState) return;
      const maxLeft = innerWidth - widget.offsetWidth - 10;
      const maxTop = innerHeight - widget.offsetHeight - 10;
      widget.style.left = `${Math.max(10, Math.min(maxLeft, dragState.left + event.clientX - dragState.x))}px`;
      widget.style.top = `${Math.max(10, Math.min(maxTop, dragState.top + event.clientY - dragState.y))}px`;
    });

    document.getElementById("dragHandle").addEventListener("pointerup", event => {
      dragState = null;
      event.currentTarget.releasePointerCapture(event.pointerId);
    });

    render();
  </script>
</body>
</html>
