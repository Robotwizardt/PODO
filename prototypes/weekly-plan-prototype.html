<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PODO 周计划原型</title>
  <!-- Three variants of the weekly-plan page, switchable via ?variant=A/B/C. PROTOTYPE ONLY. -->
  <style>
    :root {
      --bg: #08111f;
      --sidebar: #0b1626;
      --surface: #101e31;
      --surface-2: #15263b;
      --surface-3: #1b3049;
      --border: rgba(222, 237, 255, 0.13);
      --border-strong: rgba(222, 237, 255, 0.24);
      --text: #f4f8ff;
      --muted: #aebfd3;
      --faint: #7890aa;
      --accent: #54b8ff;
      --accent-hover: #7bc8ff;
      --accent-soft: rgba(84, 184, 255, 0.16);
      --green: #42d392;
      --green-soft: rgba(66, 211, 146, 0.14);
      --orange: #ffb15c;
      --orange-soft: rgba(255, 177, 92, 0.14);
      --violet: #a99bff;
      --violet-soft: rgba(169, 155, 255, 0.15);
      --rose: #ff8197;
      --rose-soft: rgba(255, 129, 151, 0.14);
      --radius: 8px;
      --sidebar-width: 228px;
      --topbar-height: 74px;
      --switcher-height: 54px;
      --hour-height: 72px;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      overflow-x: hidden;
    }

    button, input, select { font: inherit; letter-spacing: 0; }

    button { touch-action: manipulation; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #bfe4ff;
      outline-offset: 2px;
    }

    button, .task-card, .project-filter { cursor: pointer; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      background:
        linear-gradient(rgba(84, 184, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(84, 184, 255, 0.025) 1px, transparent 1px),
        var(--bg);
      background-size: 32px 32px;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 16px 18px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: rgba(11, 22, 38, 0.98);
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 44px;
      padding: 0 10px;
      margin-bottom: 20px;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(84, 184, 255, 0.42);
      border-radius: 8px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .brand strong { display: block; font-size: 15px; }
    .brand small { display: block; color: var(--faint); font-size: 11px; }

    .nav-label {
      padding: 0 10px 7px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
    }

    .nav-list { display: grid; gap: 4px; }

    .nav-item {
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }

    .nav-item svg { width: 17px; height: 17px; stroke-width: 1.8; }
    .nav-item:hover { color: var(--text); background: var(--surface-2); }

    .nav-item.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: rgba(84, 184, 255, 0.32);
    }

    .nav-item.active svg { color: var(--accent); }

    .sidebar-divider { height: 1px; margin: 18px 8px; background: var(--border); }

    .filter-block { min-height: 0; }

    .project-filters { display: grid; gap: 3px; }

    .project-filter {
      min-height: 38px;
      width: 100%;
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      text-align: left;
    }

    .project-filter:hover { background: var(--surface-2); color: var(--text); }

    .project-filter.active {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--border);
    }

    .project-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .project-filter span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter-count { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px 10px 0;
      color: var(--faint);
      font-size: 11px;
    }

    .main { min-width: 0; padding-bottom: calc(var(--switcher-height) + 34px); }

    .topbar {
      position: sticky;
      top: 0;
      min-height: var(--topbar-height);
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto minmax(250px, 1fr);
      align-items: center;
      gap: 18px;
      padding: 11px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 17, 31, 0.96);
      z-index: 20;
    }

    .page-title-row { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .page-title-row h1 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 650; }

    .prototype-badge {
      padding: 3px 7px;
      border: 1px solid rgba(255, 177, 92, 0.34);
      border-radius: 6px;
      color: var(--orange);
      background: var(--orange-soft);
      font-size: 11px;
      white-space: nowrap;
    }

    .week-nav { display: flex; align-items: center; gap: 6px; }

    .week-range {
      min-width: 164px;
      color: var(--text);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .icon-button, .ghost-button, .primary-button, .segmented button {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      background: var(--surface);
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease, opacity 150ms ease;
    }

    .icon-button {
      width: 36px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .icon-button svg { width: 17px; height: 17px; }
    .icon-button:hover, .ghost-button:hover { color: var(--text); background: var(--surface-2); border-color: var(--border-strong); }

    .ghost-button, .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      text-decoration: none;
    }

    .ghost-button svg, .primary-button svg { width: 16px; height: 16px; }

    .primary-button {
      color: #07101d;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 650;
    }

    .primary-button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }

    .content { padding: 22px 24px 0; }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .summary-item {
      min-height: 70px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-right: 1px solid var(--border);
    }

    .summary-item:last-child { border-right: 0; }

    .summary-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: var(--accent);
      background: var(--accent-soft);
    }

    .summary-icon svg { width: 17px; height: 17px; }
    .summary-text small { display: block; color: var(--muted); font-size: 11px; }
    .summary-text strong { display: block; margin-top: 2px; font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }

    .progress-summary { display: block; }
    .progress-line { display: flex; justify-content: space-between; align-items: center; }
    .progress-track { height: 5px; margin-top: 9px; overflow: hidden; border-radius: 4px; background: var(--surface-3); }
    .progress-bar { height: 100%; width: 0; background: var(--green); transition: width 180ms ease; }

    .view-toolbar {
      min-height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .view-title { min-width: 0; }
    .view-title h2 { margin: 0; font-size: 15px; font-weight: 650; }
    .view-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

    .segmented {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    .segmented button {
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      font-size: 12px;
    }

    .segmented button.active { color: var(--text); background: var(--surface-3); }

    .variant-root { min-height: 460px; }

    /* Variant A: course timetable */
    .timetable-shell {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .timetable-header {
      display: grid;
      grid-template-columns: 58px repeat(7, minmax(0, 1fr));
      min-height: 62px;
      border-bottom: 1px solid var(--border);
      background: #0d1a2b;
    }

    .corner-cell { border-right: 1px solid var(--border); }

    .day-head {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--border);
    }

    .day-head:last-child { border-right: 0; }
    .day-head span { color: var(--muted); font-size: 11px; }

    .day-head strong {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      margin-top: 2px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .day-head.today span { color: var(--accent); }
    .day-head.today strong { color: #07101d; background: var(--accent); }

    .timetable-scroll { max-height: 670px; overflow-y: auto; scrollbar-color: var(--surface-3) transparent; }

    .timetable-body {
      min-height: calc(13 * var(--hour-height));
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
    }

    .time-gutter { position: relative; border-right: 1px solid var(--border); background: #0d1a2b; }

    .time-label {
      position: absolute;
      right: 10px;
      transform: translateY(-8px);
      color: var(--faint);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .day-lanes {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--hour-height) - 1px), var(--border) calc(var(--hour-height) - 1px), var(--border) var(--hour-height));
    }

    .day-lane { position: relative; min-width: 0; border-right: 1px solid var(--border); }
    .day-lane:last-child { border-right: 0; }
    .day-lane.today { background: rgba(84, 184, 255, 0.025); }

    .now-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--rose);
      z-index: 2;
      pointer-events: none;
    }

    .now-line::before {
      content: "";
      position: absolute;
      left: -3px;
      top: -3px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--rose);
    }

    .task-card {
      position: absolute;
      left: 5px;
      right: 5px;
      min-height: 44px;
      overflow: hidden;
      padding: 7px 8px 6px 10px;
      border: 1px solid var(--task-border);
      border-left: 3px solid var(--task-color);
      border-radius: 6px;
      color: var(--text);
      background: var(--task-bg);
      text-align: left;
      z-index: 3;
      transition: border-color 150ms ease, filter 150ms ease, opacity 150ms ease;
    }

    .task-card:hover { filter: brightness(1.13); border-color: var(--task-color); }
    .task-card.completed { opacity: 0.55; }
    .task-card.completed .task-title { text-decoration: line-through; }
    .task-time { color: var(--task-color); font-size: 10px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .task-title { margin-top: 2px; overflow: hidden; font-size: 11px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }

    .task-project {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      gap: 4px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
    }

    .task-project i { width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--task-color); }
    .task-project span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .mobile-week-list { display: none; }

    /* Variant B: daily board */
    .week-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .board-day {
      min-width: 0;
      min-height: 270px;
      padding: 14px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .board-day:nth-child(4), .board-day:nth-child(7) { border-right: 0; }
    .board-day:nth-child(n+5) { border-bottom: 0; }
    .board-day.today { background: rgba(84, 184, 255, 0.035); }

    .board-day-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .board-date { display: flex; align-items: baseline; gap: 7px; }
    .board-date strong { font-size: 15px; }
    .board-date span { color: var(--muted); font-size: 11px; }
    .board-count { color: var(--faint); font-size: 10px; }

    .board-task-list { display: grid; gap: 7px; }

    .board-task {
      width: 100%;
      min-height: 64px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface-2);
      text-align: left;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .board-task:hover { background: var(--surface-3); border-color: var(--border-strong); }

    .check-control {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      margin-top: 1px;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      color: #07101d;
      background: transparent;
    }

    .check-control svg { width: 12px; height: 12px; opacity: 0; }
    .check-control.checked { border-color: var(--green); background: var(--green); }
    .check-control.checked svg { opacity: 1; }
    .board-task.completed .board-task-title, .agenda-task.completed .agenda-title { text-decoration: line-through; color: var(--faint); }
    .board-task-time { color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
    .board-task-title { margin-top: 2px; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }

    .project-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      margin-top: 7px;
      padding: 2px 6px;
      border: 1px solid var(--chip-border);
      border-radius: 5px;
      color: var(--chip-color);
      background: var(--chip-bg);
      font-size: 9px;
    }

    .project-chip svg { width: 10px; height: 10px; }
    .project-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .empty-day { padding: 18px 0; color: var(--faint); font-size: 11px; text-align: center; }

    /* Variant C: agenda + project load */
    .focus-layout {
      display: grid;
      grid-template-columns: 208px minmax(380px, 1fr) 260px;
      min-height: 610px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .mini-week, .project-load { padding: 16px; background: #0d1a2b; }
    .mini-week { border-right: 1px solid var(--border); }
    .project-load { border-left: 1px solid var(--border); }
    .panel-kicker { margin: 0 0 12px; color: var(--muted); font-size: 11px; font-weight: 600; }

    .mini-days { display: grid; gap: 5px; }

    .mini-day {
      min-height: 47px;
      width: 100%;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      text-align: left;
    }

    .mini-day:hover { color: var(--text); background: var(--surface-2); }
    .mini-day.active { color: var(--text); background: var(--accent-soft); border-color: rgba(84, 184, 255, 0.3); }
    .mini-day-number { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .mini-day-name { font-size: 11px; }
    .mini-day-count { min-width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: var(--faint); background: var(--surface-2); font-size: 10px; }

    .agenda { min-width: 0; padding: 18px 22px; }
    .agenda-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--border); }
    .agenda-heading h3 { margin: 0; font-size: 16px; }
    .agenda-heading span { color: var(--muted); font-size: 11px; }

    .agenda-list { position: relative; margin-top: 2px; }

    .agenda-task {
      position: relative;
      min-height: 76px;
      display: grid;
      grid-template-columns: 55px 18px minmax(0, 1fr) 24px;
      gap: 10px;
      align-items: start;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }

    .agenda-time { color: var(--muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .agenda-node { width: 9px; height: 9px; margin: 4px 0 0 4px; border-radius: 50%; background: var(--node-color); box-shadow: 0 0 0 4px var(--node-soft); }
    .agenda-task::before { content: ""; position: absolute; left: 73px; top: 27px; bottom: -9px; width: 1px; background: var(--border); }
    .agenda-task:last-child::before { display: none; }
    .agenda-title { font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .agenda-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; color: var(--faint); font-size: 10px; }

    .agenda-check {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--faint);
      background: transparent;
    }

    .agenda-check:hover { color: var(--green); border-color: var(--green); }
    .agenda-check svg { width: 14px; height: 14px; }
    .agenda-check.done { color: #07101d; background: var(--green); border-color: var(--green); }

    .project-load-list { display: grid; gap: 14px; }
    .load-item { min-width: 0; }
    .load-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .load-head span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .load-head strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .load-track { height: 5px; margin-top: 7px; border-radius: 4px; overflow: hidden; background: var(--surface-3); }
    .load-bar { height: 100%; border-radius: 4px; background: var(--load-color); }

    .project-legend { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
    .legend-row { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--muted); font-size: 10px; }
    .legend-row i { width: 7px; height: 7px; border-radius: 50%; }

    /* Morning / afternoon capacity model shared by all variants. */
    .period-table {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .period-table-head,
    .period-table-row {
      display: grid;
      grid-template-columns: 72px repeat(7, minmax(0, 1fr));
    }

    .period-table-head {
      min-height: 62px;
      border-bottom: 1px solid var(--border);
      background: #0d1a2b;
    }

    .period-corner,
    .period-label,
    .period-cell {
      border-right: 1px solid var(--border);
    }

    .period-table-head > :last-child,
    .period-table-row > :last-child { border-right: 0; }

    .period-table-row + .period-table-row { border-top: 1px solid var(--border); }

    .period-label {
      min-height: 292px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--muted);
      background: #0d1a2b;
      font-size: 11px;
    }

    .period-label svg { width: 17px; height: 17px; color: var(--accent); }
    .period-label span:last-child { color: var(--faint); font-size: 9px; }

    .period-cell {
      min-width: 0;
      min-height: 292px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
    }

    .period-cell.today { background: rgba(84, 184, 255, 0.035); }

    .slot-task {
      width: 100%;
      min-height: 45px;
      display: grid;
      grid-template-columns: 15px minmax(0, 1fr);
      gap: 6px;
      align-items: start;
      padding: 7px;
      border: 1px solid var(--task-border);
      border-left: 3px solid var(--task-color);
      border-radius: 6px;
      color: var(--text);
      background: var(--task-bg);
      text-align: left;
    }

    .slot-task:hover { border-color: var(--task-color); filter: brightness(1.1); }
    .slot-task.completed { opacity: 0.55; }
    .slot-task.completed .slot-task-title { text-decoration: line-through; }
    .slot-check { width: 13px; height: 13px; margin-top: 2px; border: 1px solid var(--task-color); border-radius: 50%; }
    .slot-task.completed .slot-check { background: var(--task-color); box-shadow: inset 0 0 0 3px var(--task-bg); }
    .slot-task-title { display: block; overflow: hidden; font-size: 10px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
    .slot-task-project { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .slot-empty { margin: auto; color: var(--faint); font-size: 10px; text-align: center; }
    .slot-overflow { margin-top: auto; padding: 4px 0 0; color: var(--accent); font-size: 9px; text-align: center; }

    .board-period {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .board-period:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
    .board-period-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; color: var(--muted); font-size: 10px; }
    .board-period-title span:first-child { display: flex; align-items: center; gap: 5px; }
    .board-period-title svg { width: 12px; height: 12px; color: var(--accent); }

    .agenda-period { padding: 14px 0 4px; }
    .agenda-period + .agenda-period { border-top: 1px solid var(--border); }
    .agenda-period-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .agenda-period-head span:first-child { display: flex; align-items: center; gap: 7px; }
    .agenda-period-head svg { width: 14px; height: 14px; color: var(--accent); }
    .period-tag { color: var(--accent); }

    .empty-week {
      min-height: 430px;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .empty-week svg { width: 34px; height: 34px; color: var(--accent); }
    .empty-week h3 { margin: 12px 0 3px; font-size: 14px; }
    .empty-week p { margin: 0; color: var(--muted); font-size: 12px; }

    .prototype-switcher {
      position: fixed;
      left: calc(var(--sidebar-width) + (100vw - var(--sidebar-width)) / 2);
      bottom: 18px;
      transform: translateX(-50%);
      min-height: var(--switcher-height);
      display: grid;
      grid-template-columns: 42px minmax(188px, auto) 42px;
      align-items: center;
      padding: 5px;
      border: 1px solid rgba(191, 228, 255, 0.28);
      border-radius: 10px;
      background: #06101d;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38);
      z-index: 70;
    }

    .switcher-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
    }

    .switcher-button:hover { color: var(--text); background: var(--surface-2); }
    .switcher-button svg { width: 18px; height: 18px; }
    .switcher-label { padding: 0 12px; text-align: center; }
    .switcher-label strong { display: block; font-size: 12px; }
    .switcher-label small { display: block; color: var(--faint); font-size: 10px; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.66);
      z-index: 90;
    }

    .dialog-backdrop.open { display: flex; }

    .dialog {
      width: min(620px, 100%);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: #101e31;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
    }

    .dialog-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
    .dialog-header h2 { margin: 0; font-size: 16px; }
    .dialog-content { padding: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 11px; }

    .field input, .field select {
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface-2);
    }

    .field input::placeholder { color: var(--faint); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }

    [hidden] { display: none !important; }

    .add-mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 16px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1a2b;
    }

    .add-mode-switch button {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
    }

    .add-mode-switch button:hover { color: var(--text); background: var(--surface-2); }
    .add-mode-switch button.active { color: var(--text); border-color: rgba(84, 184, 255, .34); background: var(--accent-soft); }
    .add-mode-switch svg { width: 16px; height: 16px; color: var(--accent); }
    .mode-description { margin: 0 0 10px; color: var(--muted); font-size: 11px; }

    .source-todo-list {
      max-height: 230px;
      display: grid;
      gap: 6px;
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-color: var(--surface-3) transparent;
    }

    .source-todo {
      width: 100%;
      min-height: 54px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface-2);
      text-align: left;
    }

    .source-todo:hover { border-color: var(--border-strong); background: var(--surface-3); }
    .source-todo.selected { border-color: var(--accent); background: var(--accent-soft); }
    .source-radio { width: 15px; height: 15px; border: 1px solid var(--border-strong); border-radius: 50%; }
    .source-todo.selected .source-radio { border: 4px solid var(--accent); }
    .source-title { display: block; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
    .source-meta { display: flex; flex-wrap: wrap; gap: 5px 9px; margin-top: 3px; color: var(--faint); font-size: 9px; }
    .source-project { padding: 2px 6px; border-radius: 5px; color: var(--source-color); background: var(--source-soft); font-size: 9px; white-space: nowrap; }
    .source-empty { padding: 24px; border: 1px dashed var(--border); border-radius: 7px; color: var(--muted); text-align: center; font-size: 11px; }

    .schedule-fields { margin-top: 16px; padding-top: 15px; border-top: 1px solid var(--border); }
    .schedule-heading { margin: 0 0 10px; color: var(--text); font-size: 12px; font-weight: 650; }
    .inherit-hint { min-height: 34px; display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; color: var(--muted); background: var(--surface-2); font-size: 10px; }
    .inherit-hint svg { width: 13px; height: 13px; color: var(--accent); }

    .detail-list { display: grid; gap: 10px; margin: 0; }
    .detail-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
    .detail-row dt { color: var(--faint); font-size: 11px; }
    .detail-row dd { margin: 0; color: var(--text); font-size: 12px; overflow-wrap: anywhere; }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      max-width: min(340px, calc(100vw - 44px));
      padding: 11px 14px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      color: var(--text);
      background: #15263b;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 100;
      font-size: 12px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1180px) {
      :root { --sidebar-width: 198px; }
      .topbar { grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr); padding-inline: 18px; }
      .content { padding-inline: 18px; }
      .focus-layout { grid-template-columns: 176px minmax(330px, 1fr) 220px; }
      .project-load, .mini-week { padding: 13px; }
      .agenda { padding-inline: 16px; }
    }

    @media (max-width: 960px) {
      .app-shell { grid-template-columns: 72px minmax(0, 1fr); }
      .sidebar { padding-inline: 10px; }
      .brand { justify-content: center; padding: 0; }
      .brand-copy, .nav-label, .nav-item span, .filter-block, .sidebar-divider, .sidebar-footer { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .prototype-switcher { left: calc(72px + (100vw - 72px) / 2); }
      .topbar { grid-template-columns: 1fr auto; }
      .week-nav { grid-row: 2; grid-column: 1 / -1; justify-content: center; }
      .top-actions { grid-column: 2; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .summary-item:nth-child(2) { border-right: 0; }
      .summary-item:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .focus-layout { grid-template-columns: 164px minmax(0, 1fr); }
      .project-load { display: none; }
      .week-board { grid-template-columns: repeat(2, 1fr); }
      .period-table { overflow-x: auto; }
      .period-table-head, .period-table-row { min-width: 980px; }
      .board-day, .board-day:nth-child(4), .board-day:nth-child(7) { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
      .board-day:nth-child(even) { border-right: 0; }
      .board-day:last-child { grid-column: 1 / -1; border-right: 0; border-bottom: 0; }
    }

    @media (max-width: 700px) {
      .app-shell { display: block; }
      .sidebar { position: sticky; height: 58px; padding: 7px 10px; flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand { min-height: 42px; margin: 0 10px 0 0; }
      .brand-mark { width: 30px; height: 30px; }
      .nav-list { display: flex; flex: 1; justify-content: space-around; }
      .nav-item { width: 42px; min-height: 42px; }
      .nav-item:nth-child(1), .nav-item:nth-child(2), .nav-item:nth-child(6) { display: none; }
      .main { padding-bottom: 94px; }
      .topbar { position: static; min-height: auto; grid-template-columns: 1fr auto; padding: 14px 14px 11px; }
      .page-title-row h1 { font-size: 18px; }
      .prototype-badge { display: none; }
      .top-actions .ghost-button { width: 38px; padding: 0; }
      .top-actions .ghost-button span { display: none; }
      .week-nav { grid-column: 1 / -1; width: 100%; }
      .week-range { flex: 1; min-width: 0; }
      .content { padding: 14px 12px 0; }
      .summary-strip { grid-template-columns: repeat(3, 1fr); margin-bottom: 14px; }
      .summary-item { min-height: 62px; padding: 10px; gap: 8px; }
      .summary-item:nth-child(-n+2) { border-bottom: 0; }
      .summary-item:nth-child(2) { border-right: 1px solid var(--border); }
      .summary-item:nth-child(3) { border-right: 0; }
      .summary-item:nth-child(4) { grid-column: 1 / -1; min-height: 52px; border-top: 1px solid var(--border); }
      .summary-icon { width: 30px; height: 30px; }
      .summary-text strong { font-size: 15px; }
      .view-toolbar { align-items: flex-end; }
      .view-title p { display: none; }
      .segmented button { padding: 0 8px; }
      .timetable-header, .timetable-scroll { display: none; }
      .period-table { overflow: visible; }
      .period-table-head, .period-table-row { min-width: 0; }
      .period-table-head { grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .period-corner { display: none; }
      .period-table-row { display: block; }
      .period-label { min-height: 42px; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--border); }
      .period-label span:last-child { margin-left: 4px; }
      .period-cell { min-height: 0; border-right: 0; border-bottom: 1px solid var(--border); }
      .period-cell::before { content: attr(data-day); display: block; margin-bottom: 3px; color: var(--muted); font-size: 10px; font-weight: 600; }
      .period-cell:last-child { border-bottom: 0; }
      .mobile-week-list { display: grid; }
      .mobile-day { padding: 13px; border-bottom: 1px solid var(--border); }
      .mobile-day:last-child { border-bottom: 0; }
      .mobile-day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
      .mobile-day-head strong { font-size: 13px; }
      .mobile-day-head span { color: var(--muted); font-size: 10px; }
      .week-board { grid-template-columns: 1fr; }
      .board-day, .board-day:nth-child(even), .board-day:last-child { grid-column: auto; min-height: 0; border-right: 0; border-bottom: 1px solid var(--border); }
      .board-day:last-child { border-bottom: 0; }
      .focus-layout { display: block; min-height: 0; }
      .mini-week { border-right: 0; border-bottom: 1px solid var(--border); }
      .mini-days { grid-template-columns: repeat(7, 1fr); gap: 3px; }
      .mini-day { min-height: 48px; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 2px; text-align: center; }
      .mini-day-count { display: none; }
      .agenda { padding: 14px; }
      .agenda-task { grid-template-columns: 46px 14px minmax(0, 1fr) 24px; gap: 7px; }
      .agenda-task::before { left: 60px; }
      .prototype-switcher { left: 50%; bottom: 14px; grid-template-columns: 40px minmax(160px, auto) 40px; }
      .switcher-button { width: 40px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .toast { left: 14px; right: 14px; bottom: 84px; max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="archive" aria-hidden="true"></i></div>
        <div class="brand-copy"><strong>PODO</strong><small>桌面收纳工具</small></div>
      </div>

      <div class="nav-label">工作台</div>
      <nav class="nav-list">
        <a class="nav-item" href="#" aria-label="文件收纳"><i data-lucide="inbox" aria-hidden="true"></i><span>文件收纳</span></a>
        <a class="nav-item" href="#" aria-label="桌面便签"><i data-lucide="sticky-note" aria-hidden="true"></i><span>桌面便签</span></a>
        <a class="nav-item" href="#" aria-label="项目收纳盒"><i data-lucide="briefcase-business" aria-hidden="true"></i><span>项目收纳盒</span></a>
        <a class="nav-item active" href="#" aria-current="page" aria-label="周计划"><i data-lucide="calendar-days" aria-hidden="true"></i><span>周计划</span></a>
        <a class="nav-item" href="#" aria-label="归档"><i data-lucide="archive-restore" aria-hidden="true"></i><span>归档</span></a>
        <a class="nav-item" href="#" aria-label="设置"><i data-lucide="settings" aria-hidden="true"></i><span>设置</span></a>
      </nav>

      <div class="sidebar-divider"></div>
      <div class="filter-block">
        <div class="nav-label">项目筛选</div>
        <div class="project-filters" id="projectFilters"></div>
      </div>

      <div class="sidebar-footer">原型数据不会保存</div>
    </aside>

    <main class="main" id="mainContent">
      <header class="topbar">
        <div class="page-title-row">
          <h1>周计划</h1>
          <span class="prototype-badge">交互原型</span>
        </div>

        <div class="week-nav" aria-label="周切换">
          <button class="icon-button" id="prevWeek" type="button" aria-label="上一周" title="上一周"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
          <button class="ghost-button" id="todayButton" type="button"><i data-lucide="locate-fixed" aria-hidden="true"></i><span>本周</span></button>
          <div class="week-range" id="weekRange"></div>
          <button class="icon-button" id="nextWeek" type="button" aria-label="下一周" title="下一周"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        </div>

        <div class="top-actions">
          <a class="ghost-button" href="weekly-plan-desktop-prototype.html"><i data-lucide="monitor" aria-hidden="true"></i><span>桌面效果</span></a>
          <button class="ghost-button" id="addTodoButton" type="button"><i data-lucide="plus" aria-hidden="true"></i><span>添加待办</span></button>
        </div>
      </header>

      <div class="content">
        <section class="summary-strip" aria-label="本周概览">
          <div class="summary-item">
            <div class="summary-icon"><i data-lucide="list-todo" aria-hidden="true"></i></div>
            <div class="summary-text"><small>本周事项</small><strong id="totalCount">0</strong></div>
          </div>
          <div class="summary-item">
            <div class="summary-icon" style="color:var(--orange);background:var(--orange-soft)"><i data-lucide="circle-dashed" aria-hidden="true"></i></div>
            <div class="summary-text"><small>待完成</small><strong id="pendingCount">0</strong></div>
          </div>
          <div class="summary-item">
            <div class="summary-icon" style="color:var(--green);background:var(--green-soft)"><i data-lucide="circle-check-big" aria-hidden="true"></i></div>
            <div class="summary-text"><small>已完成</small><strong id="completedCount">0</strong></div>
          </div>
          <div class="summary-item progress-summary">
            <div class="progress-line"><div class="summary-text"><small>完成进度</small></div><strong id="progressText">0%</strong></div>
            <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          </div>
        </section>

        <div class="view-toolbar">
          <div class="view-title"><h2 id="variantHeading">课程表视图</h2><p id="variantSubheading">按时间段查看本周待办安排</p></div>
          <div class="segmented" aria-label="完成状态筛选">
            <button type="button" data-status="all" class="active">全部</button>
            <button type="button" data-status="pending">待完成</button>
            <button type="button" data-status="completed">已完成</button>
          </div>
        </div>

        <section class="variant-root" id="variantRoot" aria-live="polite"></section>
      </div>
    </main>
  </div>

  <div class="prototype-switcher" role="group" aria-label="原型方案切换">
    <button class="switcher-button" id="prevVariant" type="button" aria-label="上一个方案" title="上一个方案"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
    <div class="switcher-label"><strong id="variantLabel"></strong><small>使用左右方向键切换</small></div>
    <button class="switcher-button" id="nextVariant" type="button" aria-label="下一个方案" title="下一个方案"><i data-lucide="arrow-right" aria-hidden="true"></i></button>
  </div>

  <div class="dialog-backdrop" id="addDialog" role="dialog" aria-modal="true" aria-labelledby="addDialogTitle">
    <form class="dialog" id="addTodoForm">
      <div class="dialog-header">
        <h2 id="addDialogTitle">添加待办</h2>
        <button class="icon-button" type="button" data-close-dialog="addDialog" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="dialog-content">
        <div class="add-mode-switch" role="group" aria-label="添加方式">
          <button type="button" class="active" data-add-mode="existing" aria-pressed="true"><i data-lucide="list-checks" aria-hidden="true"></i>选择现有待办</button>
          <button type="button" data-add-mode="new" aria-pressed="false"><i data-lucide="square-pen" aria-hidden="true"></i>新建待办事项</button>
        </div>

        <section id="existingTodoPanel">
          <p class="mode-description">显示所有待办标签中未归档、未完成且尚未排入周计划的事项。</p>
          <div class="source-todo-list" id="sourceTodoList" role="radiogroup" aria-label="可选择的现有待办"></div>
        </section>

        <section id="newTodoPanel" hidden>
          <p class="mode-description">选择待办标签并输入内容，提交后会自动在该标签中新建同一条待办事项。</p>
          <div class="form-grid">
            <div class="field"><label for="todoLabel">待办标签</label><select id="todoLabel" name="label"></select></div>
            <div class="field"><label for="todoTitle">待办事项</label><input id="todoTitle" name="title" maxlength="80" placeholder="写下一件要做的事" disabled></div>
            <div class="field full"><div class="inherit-hint" id="inheritHint"></div></div>
          </div>
        </section>

        <div class="schedule-fields">
          <p class="schedule-heading">安排到本周</p>
          <div class="form-grid">
            <div class="field"><label for="todoDay">安排日期</label><select id="todoDay" name="day"></select></div>
            <div class="field"><label for="todoPeriod">安排时段</label><select id="todoPeriod" name="period"><option value="morning">上午</option><option value="afternoon">下午</option></select></div>
          </div>
        </div>
      </div>
      <div class="dialog-actions"><button class="ghost-button" type="button" data-close-dialog="addDialog">取消</button><button class="primary-button" type="submit"><i data-lucide="plus" aria-hidden="true"></i><span id="addSubmitLabel">加入周计划</span></button></div>
    </form>
  </div>

  <div class="dialog-backdrop" id="detailDialog" role="dialog" aria-modal="true" aria-labelledby="detailDialogTitle">
    <div class="dialog">
      <div class="dialog-header">
        <h2 id="detailDialogTitle">待办详情</h2>
        <button class="icon-button" type="button" data-close-dialog="detailDialog" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div class="dialog-content" id="detailContent"></div>
      <div class="dialog-actions"><button class="ghost-button" type="button" data-close-dialog="detailDialog">关闭</button><button class="primary-button" type="button" id="detailToggle"></button></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    const MS_DAY = 86400000;
    const variants = {
      A: { label: "A · 上午下午表格", heading: "周计划表格", subheading: "每天分上午、下午，每个时段最多显示 3 条" },
      B: { label: "B · 每日周清单", heading: "每日周清单", subheading: "按天查看上午与下午的任务" },
      C: { label: "C · 聚焦日程", heading: "聚焦日程", subheading: "逐日处理上午与下午的安排" }
    };

    const projects = {
      podo: { name: "PODO 2.0", color: "#54b8ff", soft: "rgba(84,184,255,.15)" },
      thesis: { name: "毕业设计", color: "#a99bff", soft: "rgba(169,155,255,.15)" },
      website: { name: "官网改版", color: "#ffb15c", soft: "rgba(255,177,92,.15)" }
    };

    const todoLabels = [
      { id: "study", name: "学习清单", project: "thesis", archived: false },
      { id: "podo", name: "PODO 待办", project: "podo", archived: false },
      { id: "client", name: "客户事项", project: "website", archived: false },
      { id: "life", name: "生活待办", project: null, archived: false },
      { id: "old", name: "旧项目清单", project: "website", archived: true }
    ];

    const sourceTodos = [
      { id: 101, label: "study", title: "整理参考文献格式", completed: false, archived: false, scheduled: false },
      { id: 102, label: "study", title: "补充论文摘要关键词", completed: false, archived: false, scheduled: false },
      { id: 103, label: "podo", title: "检查桌面周计划窗口层级", completed: false, archived: false, scheduled: false },
      { id: 104, label: "podo", title: "记录周计划交互反馈", completed: false, archived: false, scheduled: false },
      { id: 105, label: "client", title: "确认移动端首页图片", completed: false, archived: false, scheduled: false },
      { id: 106, label: "life", title: "预约周末体检", completed: false, archived: false, scheduled: false },
      { id: 107, label: "life", title: "领取快递", completed: true, archived: false, scheduled: false },
      { id: 108, label: "old", title: "旧项目回访", completed: false, archived: false, scheduled: false },
      { id: 109, label: "client", title: "已归档的客户记录", completed: false, archived: true, scheduled: false }
    ];

    const mondayOf = date => {
      const result = new Date(date);
      result.setHours(0, 0, 0, 0);
      const day = result.getDay() || 7;
      result.setDate(result.getDate() - day + 1);
      return result;
    };

    const isoDate = date => {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    };

    const baseMonday = mondayOf(new Date());
    let displayedMonday = new Date(baseMonday);
    let activeVariant = new URLSearchParams(location.search).get("variant")?.toUpperCase() || "A";
    if (!variants[activeVariant]) activeVariant = "A";
    let statusFilter = "all";
    let projectFilter = "all";
    let selectedAgendaDay = Math.min(Math.max(((new Date()).getDay() || 7) - 1, 0), 6);
    let selectedTaskId = null;
    let addMode = "existing";
    let selectedSourceTodoId = null;
    let nextTaskId = 20;
    let nextSourceTodoId = 200;
    let toastTimer;

    const tasks = [
      { id: 1, week: isoDate(baseMonday), day: 0, period: "morning", title: "提交数据结构课程作业", project: "thesis", completed: true },
      { id: 2, week: isoDate(baseMonday), day: 0, period: "afternoon", title: "整理开题答辩材料", project: "thesis", completed: false },
      { id: 3, week: isoDate(baseMonday), day: 1, period: "morning", title: "给客户确认首页文案", project: "website", completed: false },
      { id: 4, week: isoDate(baseMonday), day: 1, period: "afternoon", title: "预约打印店装订", project: null, completed: true },
      { id: 5, week: isoDate(baseMonday), day: 2, period: "morning", title: "晨跑 5 公里", project: null, completed: true },
      { id: 6, week: isoDate(baseMonday), day: 2, period: "afternoon", title: "修复收纳盒拖拽问题", project: "podo", completed: false },
      { id: 7, week: isoDate(baseMonday), day: 3, period: "morning", title: "周计划功能原型评审", project: "podo", completed: false },
      { id: 8, week: isoDate(baseMonday), day: 3, period: "afternoon", title: "阅读《设计心理学》第 6 章", project: null, completed: false },
      { id: 9, week: isoDate(baseMonday), day: 4, period: "morning", title: "官网改版项目周会", project: "website", completed: false },
      { id: 10, week: isoDate(baseMonday), day: 4, period: "afternoon", title: "汇总本周学习笔记", project: null, completed: false },
      { id: 11, week: isoDate(baseMonday), day: 5, period: "morning", title: "购买下周生活用品", project: null, completed: false },
      { id: 12, week: isoDate(baseMonday), day: 6, period: "afternoon", title: "制定下周计划", project: null, completed: false },
      { id: 13, week: isoDate(baseMonday), day: 3, period: "morning", title: "确认空状态文案", project: "podo", completed: false },
      { id: 14, week: isoDate(baseMonday), day: 3, period: "morning", title: "整理交互反馈", project: "podo", completed: false },
      { id: 17, week: isoDate(baseMonday), day: 3, period: "afternoon", title: "整理功能验收清单", project: "podo", completed: false }
    ];

    const days = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
    const dateAt = index => new Date(displayedMonday.getTime() + index * MS_DAY);
    const dateLabel = date => `${date.getMonth() + 1}月${date.getDate()}日`;
    const isToday = date => isoDate(date) === isoDate(new Date());
    const periodInfo = {
      morning: { label: "上午", icon: "sunrise" },
      afternoon: { label: "下午", icon: "sunset" }
    };

    const tasksForSlot = (list, day, period) => list.filter(task => task.day === day && task.period === period);

    const visibleWeekTasks = () => tasks.filter(task => task.week === isoDate(displayedMonday));
    const filteredTasks = () => visibleWeekTasks().filter(task => {
      const statusMatch = statusFilter === "all" || (statusFilter === "completed" ? task.completed : !task.completed);
      const projectMatch = projectFilter === "all" || task.project === projectFilter;
      return statusMatch && projectMatch;
    });

    function renderIcons() {
      if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
    }

    function projectStyle(task) {
      const project = task.project ? projects[task.project] : null;
      return project || { name: "", color: "#7890aa", soft: "rgba(120,144,170,.13)" };
    }

    function projectChip(task) {
      if (!task.project) return "";
      const project = projects[task.project];
      return `<span class="project-chip" style="--chip-color:${project.color};--chip-bg:${project.soft};--chip-border:${project.color}55"><i data-lucide="briefcase-business" aria-hidden="true"></i><span>${escapeHtml(project.name)}</span></span>`;
    }

    function todoLabelById(id) {
      return todoLabels.find(label => label.id === id);
    }

    function availableSourceTodos() {
      return sourceTodos.filter(todo => {
        const label = todoLabelById(todo.label);
        return label && !label.archived && !todo.archived && !todo.completed && !todo.scheduled;
      });
    }

    function renderSourceTodoList() {
      const available = availableSourceTodos();
      if (!available.some(todo => todo.id === selectedSourceTodoId)) {
        selectedSourceTodoId = available[0]?.id ?? null;
      }

      document.getElementById("sourceTodoList").innerHTML = available.length
        ? available.map(todo => {
            const label = todoLabelById(todo.label);
            const project = label.project ? projects[label.project] : null;
            const projectMarkup = project
              ? `<span class="source-project" style="--source-color:${project.color};--source-soft:${project.soft}">${escapeHtml(project.name)}</span>`
              : "";
            const selected = todo.id === selectedSourceTodoId;
            return `<button class="source-todo ${selected ? "selected" : ""}" type="button" role="radio" aria-checked="${selected}" data-source-todo="${todo.id}"><span class="source-radio" aria-hidden="true"></span><span><span class="source-title">${escapeHtml(todo.title)}</span><span class="source-meta"><span>待办标签：${escapeHtml(label.name)}</span><span>未完成</span></span></span>${projectMarkup}</button>`;
          }).join("")
        : '<div class="source-empty">没有可加入的未完成待办</div>';
    }

    function updateInheritedProjectHint() {
      const label = todoLabelById(document.getElementById("todoLabel").value);
      const project = label?.project ? projects[label.project] : null;
      document.getElementById("inheritHint").innerHTML = project
        ? `<i data-lucide="briefcase-business" aria-hidden="true"></i>该标签关联项目收纳盒：<strong style="color:${project.color}">${escapeHtml(project.name)}</strong>`
        : '<i data-lucide="tag" aria-hidden="true"></i>该标签未关联项目收纳盒';
      renderIcons();
    }

    function setAddMode(mode) {
      addMode = mode;
      const isExisting = mode === "existing";
      document.getElementById("existingTodoPanel").hidden = !isExisting;
      document.getElementById("newTodoPanel").hidden = isExisting;
      document.getElementById("todoTitle").disabled = isExisting;
      document.getElementById("todoTitle").required = !isExisting;
      document.getElementById("addSubmitLabel").textContent = isExisting ? "加入周计划" : "新建并加入";
      document.querySelectorAll("[data-add-mode]").forEach(button => {
        const active = button.dataset.addMode === mode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      if (isExisting) renderSourceTodoList();
      else updateInheritedProjectHint();
    }

    function renderProjectFilters() {
      const weekTasks = visibleWeekTasks();
      const filters = [
        `<button class="project-filter ${projectFilter === "all" ? "active" : ""}" type="button" data-project-filter="all"><span class="project-dot"></span><span>全部项目</span><span class="filter-count">${weekTasks.length}</span></button>`
      ];
      Object.entries(projects).forEach(([key, project]) => {
        const count = weekTasks.filter(task => task.project === key).length;
        filters.push(`<button class="project-filter ${projectFilter === key ? "active" : ""}" type="button" data-project-filter="${key}"><span class="project-dot" style="background:${project.color}"></span><span>${escapeHtml(project.name)}</span><span class="filter-count">${count}</span></button>`);
      });
      document.getElementById("projectFilters").innerHTML = filters.join("");
    }

    function renderHeader() {
      const end = dateAt(6);
      document.getElementById("weekRange").textContent = `${displayedMonday.getFullYear()}年 ${displayedMonday.getMonth() + 1}月${displayedMonday.getDate()}日 - ${end.getMonth() + 1}月${end.getDate()}日`;
      const weekTasks = visibleWeekTasks();
      const completed = weekTasks.filter(task => task.completed).length;
      const progress = weekTasks.length ? Math.round(completed / weekTasks.length * 100) : 0;
      document.getElementById("totalCount").textContent = weekTasks.length;
      document.getElementById("pendingCount").textContent = weekTasks.length - completed;
      document.getElementById("completedCount").textContent = completed;
      document.getElementById("progressText").textContent = `${progress}%`;
      document.getElementById("progressBar").style.width = `${progress}%`;
      document.getElementById("variantLabel").textContent = variants[activeVariant].label;
      document.getElementById("variantHeading").textContent = variants[activeVariant].heading;
      document.getElementById("variantSubheading").textContent = variants[activeVariant].subheading;
      document.querySelectorAll("[data-status]").forEach(button => button.classList.toggle("active", button.dataset.status === statusFilter));
      renderProjectFilters();
    }

    function emptyWeekMarkup() {
      const hasFilters = statusFilter !== "all" || projectFilter !== "all";
      return `<div class="empty-week"><div><i data-lucide="${hasFilters ? "list-filter" : "calendar-plus"}" aria-hidden="true"></i><h3>${hasFilters ? "没有符合筛选条件的事项" : "这一周还没有安排"}</h3><p>${hasFilters ? "换个筛选条件再看看" : "添加一条待办，为这一周排个时间"}</p></div></div>`;
    }

    function slotTask(task) {
      const project = projectStyle(task);
      const projectMarkup = task.project ? `<span class="slot-task-project">${escapeHtml(project.name)}</span>` : "";
      return `<button type="button" class="slot-task ${task.completed ? "completed" : ""}" data-task-id="${task.id}" style="--task-color:${project.color};--task-bg:${project.soft};--task-border:${project.color}55" aria-label="查看待办：${escapeHtml(task.title)}"><span class="slot-check" aria-hidden="true"></span><span><span class="slot-task-title">${escapeHtml(task.title)}</span>${projectMarkup}</span></button>`;
    }

    function compactTask(task) {
      return `<button type="button" class="board-task ${task.completed ? "completed" : ""}" data-task-id="${task.id}"><span class="check-control ${task.completed ? "checked" : ""}" role="checkbox" aria-checked="${task.completed}" data-toggle-id="${task.id}" aria-label="${task.completed ? "恢复" : "完成"}待办"><i data-lucide="check" aria-hidden="true"></i></span><span><span class="board-task-title">${escapeHtml(task.title)}</span>${projectChip(task)}</span></button>`;
    }

    function limitedSlotMarkup(list, renderer, emptyText = "无安排") {
      const shown = list.slice(0, 3);
      const hidden = Math.max(0, list.length - shown.length);
      if (!shown.length) return `<div class="slot-empty">${emptyText}</div>`;
      return `${shown.map(renderer).join("")}${hidden ? `<div class="slot-overflow">另有 ${hidden} 项，进入当天查看</div>` : ""}`;
    }

    function renderVariantA(tasksForView) {
      if (!tasksForView.length) return emptyWeekMarkup();
      const header = days.map((day, index) => {
        const date = dateAt(index);
        return `<div class="day-head ${isToday(date) ? "today" : ""}"><span>${day}</span><strong>${date.getDate()}</strong></div>`;
      }).join("");

      const periodRows = Object.entries(periodInfo).map(([period, info]) => {
        const cells = days.map((day, index) => {
          const list = tasksForSlot(tasksForView, index, period);
          const date = dateAt(index);
          return `<div class="period-cell ${isToday(date) ? "today" : ""}" data-day="${day} · ${dateLabel(date)}">${limitedSlotMarkup(list, slotTask)}</div>`;
        }).join("");
          return `<div class="period-table-row"><div class="period-label"><i data-lucide="${info.icon}" aria-hidden="true"></i><span>${info.label}</span><span>最多 3 项</span></div>${cells}</div>`;
      }).join("");

      return `<div class="period-table"><div class="period-table-head"><div class="period-corner"></div>${header}</div>${periodRows}</div>`;
    }

    function renderVariantB(tasksForView) {
      if (!tasksForView.length) return emptyWeekMarkup();
      return `<div class="week-board">${days.map((day, index) => {
        const date = dateAt(index);
        const dayTasks = tasksForView.filter(task => task.day === index);
        const periods = Object.entries(periodInfo).map(([period, info]) => {
          const list = tasksForSlot(tasksForView, index, period);
          return `<div class="board-period"><div class="board-period-title"><span><i data-lucide="${info.icon}" aria-hidden="true"></i>${info.label}</span><span>${list.length}/3</span></div><div class="board-task-list">${list.length ? limitedSlotMarkup(list, compactTask) : '<div class="empty-day">无安排</div>'}</div></div>`;
        }).join("");
        return `<section class="board-day ${isToday(date) ? "today" : ""}"><div class="board-day-header"><div class="board-date"><strong>${day}</strong><span>${dateLabel(date)}</span></div><span class="board-count">${dayTasks.length} 项</span></div>${periods}</section>`;
      }).join("")}</div>`;
    }

    function renderVariantC(tasksForView) {
      if (!tasksForView.length) return emptyWeekMarkup();
      const selectedTasks = tasksForView.filter(task => task.day === selectedAgendaDay);
      const miniDays = days.map((day, index) => {
        const date = dateAt(index);
        const count = tasksForView.filter(task => task.day === index).length;
        return `<button type="button" class="mini-day ${selectedAgendaDay === index ? "active" : ""}" data-agenda-day="${index}"><span class="mini-day-number">${date.getDate()}</span><span class="mini-day-name">${day}</span><span class="mini-day-count">${count}</span></button>`;
      }).join("");

      const agendaTask = task => {
        const project = projectStyle(task);
        const projectMeta = task.project ? `<span>${escapeHtml(project.name)}</span>` : "";
        return `<article class="agenda-task ${task.completed ? "completed" : ""}" data-task-id="${task.id}" style="--node-color:${project.color};--node-soft:${project.soft}"><div class="agenda-time period-tag">${periodInfo[task.period].label}</div><div class="agenda-node"></div><div><div class="agenda-title">${escapeHtml(task.title)}</div><div class="agenda-meta">${projectMeta || "<span>未关联项目</span>"}</div></div><button type="button" class="agenda-check ${task.completed ? "done" : ""}" data-toggle-id="${task.id}" aria-label="${task.completed ? "恢复" : "完成"}待办" title="${task.completed ? "恢复" : "标记完成"}"><i data-lucide="check" aria-hidden="true"></i></button></article>`;
      };

      const agendaItems = selectedTasks.length ? Object.entries(periodInfo).map(([period, info]) => {
        const list = tasksForSlot(tasksForView, selectedAgendaDay, period);
          return `<section class="agenda-period"><div class="agenda-period-head"><span><i data-lucide="${info.icon}" aria-hidden="true"></i>${info.label}</span><span>${list.length}/3</span></div>${list.length ? limitedSlotMarkup(list, agendaTask) : '<div class="empty-day">无安排</div>'}</section>`;
      }).join("") : '<div class="empty-week"><div><i data-lucide="coffee" aria-hidden="true"></i><h3>今天没有安排</h3><p>可以留给休息，也可以添加一条待办</p></div></div>';

      const loadRows = Object.entries(projects).map(([key, project]) => {
        const count = tasksForView.filter(task => task.project === key).length;
        const width = Math.min(100, count / 5 * 100);
        return `<div class="load-item"><div class="load-head"><span>${escapeHtml(project.name)}</span><strong>${count} 项</strong></div><div class="load-track"><div class="load-bar" style="width:${width}%;--load-color:${project.color}"></div></div></div>`;
      }).join("");

      const legend = Object.values(projects).map(project => `<div class="legend-row"><i style="background:${project.color}"></i><span>${escapeHtml(project.name)}</span></div>`).join("");
      const selectedDate = dateAt(selectedAgendaDay);
      return `<div class="focus-layout"><aside class="mini-week"><p class="panel-kicker">本周日期</p><div class="mini-days">${miniDays}</div></aside><section class="agenda"><div class="agenda-heading"><h3>${days[selectedAgendaDay]} · ${dateLabel(selectedDate)}</h3><span>${selectedTasks.length} 项安排</span></div><div class="agenda-list">${agendaItems}</div></section><aside class="project-load"><p class="panel-kicker">项目负载</p><div class="project-load-list">${loadRows}</div><div class="project-legend"><p class="panel-kicker">项目收纳盒</p>${legend}</div></aside></div>`;
    }

    function render() {
      renderHeader();
      const tasksForView = filteredTasks();
      const markup = activeVariant === "A" ? renderVariantA(tasksForView) : activeVariant === "B" ? renderVariantB(tasksForView) : renderVariantC(tasksForView);
      document.getElementById("variantRoot").innerHTML = markup;
      renderIcons();
    }

    function setVariant(next) {
      activeVariant = next;
      const url = new URL(location.href);
      url.searchParams.set("variant", activeVariant);
      history.replaceState({}, "", url);
      render();
    }

    function cycleVariant(direction) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(activeVariant);
      setVariant(keys[(index + direction + keys.length) % keys.length]);
    }

    function changeWeek(offset) {
      displayedMonday = new Date(displayedMonday.getTime() + offset * 7 * MS_DAY);
      selectedAgendaDay = 0;
      render();
    }

    function toggleTask(id) {
      const task = tasks.find(item => item.id === Number(id));
      if (!task) return;
      task.completed = !task.completed;
      const sourceTodo = sourceTodos.find(item => item.id === task.sourceTodoId);
      if (sourceTodo) sourceTodo.completed = task.completed;
      showToast(task.completed ? "已标记为完成" : "已恢复为待完成");
      render();
    }

    function showTaskDetails(id) {
      const task = tasks.find(item => item.id === Number(id));
      if (!task) return;
      selectedTaskId = task.id;
      const project = task.project ? projects[task.project].name : "未关联项目";
      const sourceTodo = sourceTodos.find(item => item.id === task.sourceTodoId);
      const sourceLabel = sourceTodo ? todoLabelById(sourceTodo.label)?.name : "原型示例待办";
      const date = dateAt(task.day);
      document.getElementById("detailContent").innerHTML = `<dl class="detail-list"><div class="detail-row"><dt>待办内容</dt><dd>${escapeHtml(task.title)}</dd></div><div class="detail-row"><dt>来源标签</dt><dd>${escapeHtml(sourceLabel)}</dd></div><div class="detail-row"><dt>安排时段</dt><dd>${date.getFullYear()}年${dateLabel(date)} · ${periodInfo[task.period].label}</dd></div><div class="detail-row"><dt>项目收纳盒</dt><dd>${escapeHtml(project)}</dd></div><div class="detail-row"><dt>当前状态</dt><dd>${task.completed ? "已完成" : "待完成"}</dd></div></dl>`;
      const toggle = document.getElementById("detailToggle");
      toggle.innerHTML = `<i data-lucide="${task.completed ? "rotate-ccw" : "check"}" aria-hidden="true"></i>${task.completed ? "恢复待办" : "标记完成"}`;
      openDialog("detailDialog");
      renderIcons();
    }

    function openDialog(id) {
      const dialog = document.getElementById(id);
      dialog.classList.add("open");
      const firstControl = dialog.querySelector("input, button, select");
      setTimeout(() => firstControl?.focus(), 0);
    }

    function closeDialog(id) {
      document.getElementById(id).classList.remove("open");
      if (id === "detailDialog") selectedTaskId = null;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function fillAddForm() {
      document.getElementById("todoDay").innerHTML = days.map((day, index) => `<option value="${index}">${day} · ${dateLabel(dateAt(index))}</option>`).join("");
      document.getElementById("todoDay").value = String(selectedAgendaDay);
      document.getElementById("todoLabel").innerHTML = todoLabels.filter(label => !label.archived).map(label => `<option value="${label.id}">${escapeHtml(label.name)}</option>`).join("");
      document.getElementById("todoTitle").value = "";
      selectedSourceTodoId = null;
      setAddMode("existing");
      updateInheritedProjectHint();
    }

    document.addEventListener("click", event => {
      const toggle = event.target.closest("[data-toggle-id]");
      if (toggle) {
        event.preventDefault();
        event.stopPropagation();
        toggleTask(toggle.dataset.toggleId);
        return;
      }

      const task = event.target.closest("[data-task-id]");
      if (task) { showTaskDetails(task.dataset.taskId); return; }

      const projectButton = event.target.closest("[data-project-filter]");
      if (projectButton) { projectFilter = projectButton.dataset.projectFilter; render(); return; }

      const statusButton = event.target.closest("[data-status]");
      if (statusButton) { statusFilter = statusButton.dataset.status; render(); return; }

      const agendaDay = event.target.closest("[data-agenda-day]");
      if (agendaDay) { selectedAgendaDay = Number(agendaDay.dataset.agendaDay); render(); return; }

      const addModeButton = event.target.closest("[data-add-mode]");
      if (addModeButton) { setAddMode(addModeButton.dataset.addMode); return; }

      const sourceTodoButton = event.target.closest("[data-source-todo]");
      if (sourceTodoButton) { selectedSourceTodoId = Number(sourceTodoButton.dataset.sourceTodo); renderSourceTodoList(); return; }

      const closeButton = event.target.closest("[data-close-dialog]");
      if (closeButton) closeDialog(closeButton.dataset.closeDialog);
    });

    document.getElementById("prevWeek").addEventListener("click", () => changeWeek(-1));
    document.getElementById("nextWeek").addEventListener("click", () => changeWeek(1));
    document.getElementById("todayButton").addEventListener("click", () => { displayedMonday = new Date(baseMonday); selectedAgendaDay = Math.min(Math.max(((new Date()).getDay() || 7) - 1, 0), 6); render(); });
    document.getElementById("prevVariant").addEventListener("click", () => cycleVariant(-1));
    document.getElementById("nextVariant").addEventListener("click", () => cycleVariant(1));
    document.getElementById("addTodoButton").addEventListener("click", () => { fillAddForm(); openDialog("addDialog"); });
    document.getElementById("todoLabel").addEventListener("change", updateInheritedProjectHint);
    document.getElementById("detailToggle").addEventListener("click", () => { if (selectedTaskId != null) { toggleTask(selectedTaskId); closeDialog("detailDialog"); } });

    document.getElementById("addTodoForm").addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const day = Number(data.get("day"));
      const period = String(data.get("period"));
      const slotCount = tasks.filter(task => task.week === isoDate(displayedMonday) && task.day === day && task.period === period).length;
      if (slotCount >= 3) {
        showToast(`${days[day]}${periodInfo[period].label}已安排 3 项，请选择其他时段`);
        return;
      }
      let title;
      let project;
      let sourceTodoId;
      if (addMode === "existing") {
        const sourceTodo = sourceTodos.find(todo => todo.id === selectedSourceTodoId);
        if (!sourceTodo || !availableSourceTodos().some(todo => todo.id === sourceTodo.id)) {
          showToast("请先选择一条未完成待办");
          return;
        }
        const label = todoLabelById(sourceTodo.label);
        title = sourceTodo.title;
        project = label.project;
        sourceTodoId = sourceTodo.id;
        sourceTodo.scheduled = true;
      } else {
        const label = todoLabelById(String(data.get("label")));
        title = String(data.get("title")).trim();
        if (!label || !title) {
          showToast("请选择待办标签并输入待办事项");
          return;
        }
        project = label.project;
        sourceTodoId = nextSourceTodoId++;
        sourceTodos.push({ id: sourceTodoId, label: label.id, title, completed: false, archived: false, scheduled: true });
      }

      tasks.push({
        id: nextTaskId++,
        week: isoDate(displayedMonday),
        day,
        period,
        title,
        project,
        sourceTodoId,
        completed: false
      });
      event.currentTarget.reset();
      closeDialog("addDialog");
      showToast(addMode === "existing" ? "已从现有待办加入周计划" : "已在对应标签中新建并加入周计划");
      render();
    });

    document.querySelectorAll(".dialog-backdrop").forEach(backdrop => backdrop.addEventListener("mousedown", event => {
      if (event.target === backdrop) closeDialog(backdrop.id);
    }));

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        document.querySelectorAll(".dialog-backdrop.open").forEach(dialog => closeDialog(dialog.id));
        return;
      }
      const target = event.target;
      if (target.matches("input, textarea, select, [contenteditable]")) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    render();
  </script>
</body>
</html>
